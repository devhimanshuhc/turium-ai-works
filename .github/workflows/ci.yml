name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_inbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          cache: true

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory apps/server

      - name: Build shared package
        run: pnpm package

      - name: Lint
        run: |
          pnpm lint
          uv run --directory apps/server ruff check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
